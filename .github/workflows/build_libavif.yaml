# This job builds a *decode-only* libavif (dav1d statically embedded, no encoders
# and no CLI apps) from source, which we upload to S3 and then link against
# during wheel builds. This lets us bundle a tiny self-contained libavif.so
# instead of conda-forge's libavif, which drags in ~20MB of unused AV1 encoder
# libraries.
#
# Upload to S3 needs to be done manually, and it should be done only once per
# new libavif version.
name: Build decode-only libavif from source

on:
  workflow_dispatch:
    inputs:
      tag:
        default: 'latest'
        description: 'torchcodec version'
        type: string
        required: true
  # schedule:
  #   - cron: '0 0 * * 0'  # on sunday

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      torchcodec_tag: ${{ steps.get-version.outputs.torchcodec_tag }}
      libavif_version: ${{ steps.get-version.outputs.libavif_version }}

    steps:
      - name: Get Version
        id: get-version
        run: |
          tag=${{ inputs.tag }}
          if [ "$tag" = "latest" ]; then
            tag=$(curl --retry 10 -s "https://api.github.com/repos/meta-pytorch/torchcodec/releases/latest" | jq -r .tag_name)
          fi
          if [ -z "${tag}" ] || [ "${tag}" == "null" ]; then
            echo "Failed to get tag"
            exit 1
          fi

          version=$(curl --retry 10 -sSL https://github.com/meta-pytorch/torchcodec/raw/refs/tags/${tag}/src/torchcodec/_core/fetch_avif_from_s3.cmake | grep -oP 'torchcodec/libavif/\K[0-9-]+')
          if [ -z "${version}" ] || [ "${version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi

          echo "torchcodec_tag=${tag}" >> $GITHUB_OUTPUT
          echo "libavif_version=${version}" >> $GITHUB_OUTPUT
          echo ""
          echo "==== Build Args ===="
          echo "torchcodec: ${tag}"
          echo "libavif: ${version}"

  libavif-Linux-loongarch64:
    runs-on: ubuntu-latest
    needs: Get-Version
    env:
      torchcodec_tag: ${{ needs.Get-Version.outputs.torchcodec_tag }}
    strategy:
      fail-fast: false
      matrix:
        libavif-version: ["1.4.2"]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: libavif

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build libavif
        run: |
          mkdir -p packaging
          rm -f packaging/build_libavif.sh
          wget -qO packaging/build_libavif.sh https://github.com/meta-pytorch/torchcodec/raw/refs/tags/${torchcodec_tag}/packaging/build_libavif.sh
          sudo chmod +x packaging/build_libavif.sh

          # ERROR: no toolchain provisioning for Linux-loongarch64
          sed -i '/^missing=false$/a yum install -y ninja-build meson\n' packaging/build_libavif.sh

          docker run --rm \
            --platform linux/loong64 \
            --volume "$(pwd):/io" \
            --env "LIBAVIF_VERSION=${{ matrix.libavif-version }}" \
            --env "LIBAVIF_ROOT=/io/libavif" \
            --workdir /io \
            ghcr.io/loong64/manylinuxloongarch64-builder:cpu-loongarch64 \
            /io/packaging/build_libavif.sh

          tar -cf libavif.tar.gz libavif/include libavif/lib libavif/licenses
          mv libavif.tar.gz ${{ matrix.libavif-version }}.tar.gz

      - name: Upload libavif Binaries
        uses: actions/upload-artifact@v7
        with:
          name: libavif-${{ matrix.libavif-version }}
          path: "${{ matrix.libavif-version }}.tar.gz"
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs:
      - Get-Version
      - libavif-Linux-loongarch64
    env:
      libavif_version: ${{ needs.Get-Version.outputs.libavif_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: libavif
      
      - name: Setup Git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: libavif
          pattern: libavif-*
          merge-multiple: true

      - name: Upload artifacts
        run: |
          artifact_dir="${libavif_version}"
          rm -rf "${artifact_dir}/linux_loongarch64"
          mkdir -p "${artifact_dir}"
          mv libavif "${artifact_dir}/linux_loongarch64"
          git add .
          git commit -m "Update libavif binaries ${libavif_version}"
          git push origin libavif